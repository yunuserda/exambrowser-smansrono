name: Build Exambrowser Windows

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Build Tauri App (Windows Only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseDraft: false
          prerelease: false

      - name: Upload Artifacts (.exe & .msi)
        uses: actions/upload-artifact@v4
        with:
          name: Exambrowser-Windows
          path: |
            **/target/release/*.exe
            **/target/release/bundle/**/*.exe
            **/target/release/bundle/**/*.msi
          if-no-files-found: warn